<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>RestaurantOS Office</title>
<style>
:root{
  color-scheme:light;
  --brand:#9fe870;--brand-ink:#163300;--brand-wash:rgba(159,232,112,.18);
  --bg:#f2f1ec;--panel:#fff;--surface:#fff;--surface-2:#e9ebe4;
  --ink:#0e0f0c;--ink-2:#3f423d;--ink-3:#5f635c;--ink-4:#787c74;
  --info:#0a7ea4;--info-wash:rgba(10,126,164,.10);--info-line:rgba(10,126,164,.30);
  --amber:#a16207;--amber-wash:rgba(161,98,7,.10);--amber-line:rgba(161,98,7,.30);
  --green:#116e3b;--green-wash:rgba(17,110,59,.10);--green-line:rgba(17,110,59,.32);
  --red:#c22f35;--red-wash:rgba(194,47,53,.09);--red-line:rgba(194,47,53,.32);
  --line:rgba(14,15,12,.12);--line-subtle:rgba(14,15,12,.06);
  --ring:0 0 0 1px rgba(14,15,12,.12);--shadow-sm:0 2px 8px rgba(14,15,12,.08);
  --font:"Inter",ui-sans-serif,system-ui,sans-serif;--mono:ui-monospace,Consolas,monospace;
  --rail:86px;--topbar:56px;--tap:44px;--safe-b:env(safe-area-inset-bottom,0px);
  --vph:100vh;
}
@supports (height:100dvh){:root{--vph:100dvh}}
@media (prefers-color-scheme:dark){:root{
  color-scheme:dark;
  --bg:#0e0f0c;--panel:#161814;--surface:#1d201b;--surface-2:#282c26;
  --ink:#f2f1ec;--ink-2:#c9cdc4;--ink-3:#9a9e94;--ink-4:#83877d;
  --info:#4cc3e8;--info-wash:rgba(76,195,232,.12);--info-line:rgba(76,195,232,.34);
  --amber:#e3b341;--amber-wash:rgba(227,179,65,.12);--amber-line:rgba(227,179,65,.34);
  --green:#34d399;--green-wash:rgba(52,211,153,.11);--green-line:rgba(52,211,153,.34);
  --red:#f0555a;--red-wash:rgba(240,85,90,.12);--red-line:rgba(240,85,90,.36);
  --line:rgba(242,241,236,.10);--line-subtle:rgba(242,241,236,.05);
  --ring:0 0 0 1px rgba(242,241,236,.10);
}}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:var(--vph)}
body{background:var(--bg);color:var(--ink);font:14.5px/1.45 var(--font);overflow:hidden;
  -webkit-font-smoothing:antialiased;display:flex;flex-direction:column}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
a{color:inherit}

/* ============================================================
   APP SHELL (UI-T1, restructured by D35/UI-T5), identical on all ten pages.
   ============================================================ */
.shell{display:grid;grid-template-columns:var(--rail) minmax(0,1fr);grid-template-rows:var(--topbar) 1fr;
  height:var(--vph);overflow:hidden}
.navrail{grid-row:1/3;background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;
  display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 0 14px;
  transition:background-color .25s ease,border-color .25s ease}
.rail-logo{width:38px;height:38px;flex-shrink:0;border-radius:999px;background:var(--brand);color:var(--brand-ink);
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px;margin-bottom:12px}
.nav-btn{width:66px;min-height:var(--tap);flex-shrink:0;padding:7px 0 6px;border-radius:12px;text-decoration:none;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;position:relative;
  color:var(--ink-3);font-size:11px;font-weight:600;transition:background-color .15s ease,color .15s ease}
.nav-btn svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round}
.nav-btn:active{transform:scale(.96)}
.nav-btn.on{background:var(--brand-wash);color:var(--ink)}
.nav-btn:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.nav-badge{position:absolute;top:2px;right:8px;min-width:18px;height:18px;padding:0 5px;border-radius:999px;
  background:var(--red);color:#fff;font-size:11px;font-weight:700;line-height:18px;text-align:center;
  font-variant-numeric:tabular-nums}
.nav-badge:empty{display:none}
.rail-spacer{flex:1}
.rail-foot{font-size:10px;color:var(--ink-4);text-align:center;padding:0 8px;line-height:1.35}
.topbar{display:flex;align-items:center;gap:12px;min-width:0;overflow:hidden;padding:0 16px;
  background:var(--panel);border-bottom:1px solid var(--line);
  transition:background-color .25s ease,border-color .25s ease}
.venue{min-width:0}
.venue b{display:block;font-size:15px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.venue small{display:block;font-size:10px;color:var(--ink-4);letter-spacing:.05em;text-transform:uppercase;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.screen-title{flex-shrink:0;font-size:13px;font-weight:700;color:var(--ink-2);
  background:var(--surface-2);border-radius:999px;padding:5px 12px;white-space:nowrap}
.top-meta{margin-left:auto;display:flex;align-items:center;gap:10px;flex-shrink:0}
.shellbody{min-width:0;min-height:0;display:flex;flex-direction:column;overflow:hidden}
@media (hover:hover){
  .nav-btn:hover{background:var(--surface-2);color:var(--ink)}
  .nav-btn.on:hover{background:var(--brand-wash)}
}
@media (hover:none){.nav-btn:hover{background:none;color:var(--ink-3)}.nav-btn.on:hover{background:var(--brand-wash);color:var(--ink)}}
@media (max-width:980px) and (min-width:821px){
  :root{--rail:64px}
  .nav-btn{width:52px;font-size:0;gap:0}
  .nav-btn svg{width:25px;height:25px}
  .rail-foot{display:none}
}
@media (max-width:820px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .navrail{position:fixed;left:0;right:0;bottom:0;top:auto;grid-row:auto;z-index:150;overflow:visible;
    flex-direction:row;justify-content:space-around;align-items:center;gap:2px;
    height:calc(58px + var(--safe-b));padding:4px 4px calc(4px + var(--safe-b));
    border-right:none;border-top:1px solid var(--line)}
  .rail-logo,.rail-spacer,.rail-foot,.screen-title{display:none}
  .nav-btn{width:auto;flex:1;min-height:48px;font-size:10px;gap:1px;padding:4px 0}
  .nav-btn svg{width:21px;height:21px}
  .shellbody{padding-bottom:calc(58px + var(--safe-b))}
  .topbar{padding:0 12px;gap:8px}
  .venue small{display:none}
}

/* ---------- APP SHELL: role refusal (E25-T2), identical on every screen ---------- */
.refusal{position:fixed;inset:0;z-index:900;background:var(--bg);display:flex;
  align-items:center;justify-content:center;padding:24px;text-align:center}
.refusal-card{max-width:380px}
.refusal-card h1{font-size:19px;letter-spacing:-.01em;margin-bottom:8px}
.refusal-card p{font-size:13.5px;color:var(--ink-2);margin-bottom:8px}
.refusal-card .who{color:var(--ink-4);font-size:12.5px;margin-bottom:20px}
.refusal-card .acts{display:flex;gap:10px;justify-content:center}
.refusal-card button{min-height:44px;padding:0 18px;border-radius:12px;
  background:var(--surface-2);color:var(--ink);font-weight:700}
.refusal-card button.p{background:var(--brand);color:var(--brand-ink)}

/* ---------- the hub itself ----------
   One card per back-office area (D35). Phone-first: a single column that
   grows into a grid once there is room for one, never the other way. */
.wrap{flex:1;overflow-y:auto;padding:18px}
.hub{display:grid;grid-template-columns:1fr;gap:14px;max-width:920px;margin:0 auto}
@media (min-width:640px){.hub{grid-template-columns:1fr 1fr}}
.card{background:var(--surface);border-radius:16px;box-shadow:var(--ring);padding:16px 18px;
  display:flex;flex-direction:column;gap:8px;transition:box-shadow .15s ease}
@media (hover:hover){.card:hover{box-shadow:var(--shadow-sm),var(--ring)}}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:var(--tap);
  text-decoration:none;font-size:17px;font-weight:700;color:var(--ink);border-radius:10px;margin:-4px -6px 0;padding:4px 6px}
.card-h:active{transform:scale(.98)}
.card-h svg{width:18px;height:18px;flex-shrink:0;fill:none;stroke:var(--ink-4);stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round}
.card-stat{font-size:13.5px;color:var(--ink-2);min-height:1.3em}
.card-stat.muted{color:var(--ink-4)}
.card-links{display:flex;flex-wrap:wrap;gap:8px;margin-top:2px}
.card-links a{min-height:var(--tap);display:inline-flex;align-items:center;padding:0 12px;border-radius:999px;
  background:var(--surface-2);color:var(--ink-2);font-size:12.5px;font-weight:600;text-decoration:none}
.card-links a:active{transform:scale(.96)}

/* ---------- the breadcrumb back to the hub (D35/UI-T5) ----------
   Menu, Reports and Settings carry this in their topbar, since they no
   longer have their own rail entry to tap back with. */
.office-crumb{min-height:44px;display:inline-flex;align-items:center;gap:4px;padding:0 12px;border-radius:999px;
  background:var(--surface-2);color:var(--ink-2);font-size:12.5px;font-weight:700;text-decoration:none}
.office-crumb:active{transform:scale(.96)}
</style>
</head>
<body>
<div class="shell">
  <!-- ===== APP SHELL: navigation rail (UI-T1, restructured D35/UI-T5). Identical
       markup on all ten navigable pages; only which entry carries "on" differs. ===== -->
  <nav class="navrail" aria-label="Screens">
    <div class="rail-logo" aria-hidden="true">R</div>
    <a class="nav-btn" href="/pos"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3.5h12v17l-3-1.8-3 1.8-3-1.8-3 1.8z"/><path d="M9.2 8.6h5.6M9.2 12.6h5.6"/></svg>Service</a>
    <a class="nav-btn" href="/tables"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="5"/><path d="M12 3.6v2.2M12 18.2v2.2M3.6 12h2.2M18.2 12h2.2"/></svg>Tables<span class="nav-badge" id="navTables"></span></a>
    <a class="nav-btn" href="/reservations"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5.4" width="17" height="15.1" rx="2.6"/><path d="M3.5 10.4h17M8.2 3.4v3.6M15.8 3.4v3.6"/></svg>Bookings</a>
    <a class="nav-btn" href="/kds"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 18.6h17"/><path d="M5.5 18.6a6.5 6.5 0 0 1 13 0"/><path d="M12 12.1V9.9"/></svg>Kitchen<span class="nav-badge" id="navKds"></span></a>
    <a class="nav-btn" href="/close"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="7.5" width="17" height="11" rx="2.5"/><path d="M3.5 12.6h17M10 15.8h4"/></svg>Close</a>
    <a class="nav-btn" href="/schedule"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.2"/><path d="M12 7.3v5l3.4 2"/></svg>Shifts</a>
    <a class="nav-btn on" aria-current="page" href="/office"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="8.2" width="17" height="11.5" rx="2"/><path d="M8.5 8.2V6.6a2 2 0 0 1 2-2h3a2 2 0 0 1 2 2v1.6M3.5 13.2h17"/></svg>Office</a>
    <div class="rail-spacer"></div>
    <div class="rail-foot">Concept build.<br>Demo data only.</div>
  </nav>
  <header class="topbar">
    <div class="venue"><b data-venue-name>RestaurantOS</b><small>RestaurantOS back office</small></div>
    <div class="screen-title">Office</div>
    <div class="top-meta"></div>
  </header>
  <div class="shellbody">
    <div class="wrap">
      <div class="hub" id="hub"></div>
    </div>
  </div>
</div>

<script>
/* The back office's front door (D35/UI-T5). D35 split the app into two
   faces: the floor keeps the rail (zero taps to work), and every management
   surface collapses into this one hub. One card per area, a live stat off a
   read the page already needs elsewhere, and nothing computed: a stat this
   page cannot honestly read is a stat it leaves off the card rather than
   guesses at. */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money=n=>"$"+(n/100).toFixed(2);
const DEVICE=(()=>{try{let d=localStorage.getItem("ros.device");if(!d){d="web-"+crypto.randomUUID().slice(0,8);localStorage.setItem("ros.device",d);}return d;}catch(_){return "web-anon";}})();

/* ---------- APP SHELL: role visibility (E25-T2, extended D35/UI-T5) ----------
   The rail renders only what the session's own matrix allows; this page
   never invents a rule of its own. Office is not itself one of the nine
   screens in staff.ts VISIBILITY: it is a hub over four of them (menu,
   reports, cash, settings), so its own rail entry (on every page) and its
   own refusal (on this one) are gated on ANY of that family being visible,
   never hardcoded to which roles that happens to be today. */
function dget(url){return fetch(url,{headers:{"x-device-id":DEVICE}});}
const RAIL_SCREEN={"/pos":"service","/tables":"tables","/reservations":"reservations",
  "/kds":"kitchen","/close":"cash","/schedule":"schedule"};
const OFFICE_FAMILY=["menu","reports","cash","settings"];
async function applyVisibility(){
  let employee=null,visibility=null;
  try{
    const s=await dget("/v1/session?deviceId="+encodeURIComponent(DEVICE)).then(r=>r.json());
    employee=s.employee;visibility=s.visibility;
  }catch(_){}
  if(visibility){
    document.querySelectorAll(".navrail .nav-btn[href]").forEach(a=>{
      const href=a.getAttribute("href");
      const visible=href==="/office"?OFFICE_FAMILY.some(s=>visibility[s]):visibility[RAIL_SCREEN[href]];
      a.style.display=visible?"":"none";
    });
  }
  if(employee&&visibility&&!OFFICE_FAMILY.some(s=>visibility[s])){
    document.body.insertAdjacentHTML("beforeend",`<div class="refusal"><div class="refusal-card">
      <h1>Not for this sign-in</h1>
      <p>The office isn't open to a ${esc(employee.role)} sign-in.</p>
      <p class="who">You are signed in as ${esc(employee.name)}, ${esc(employee.role)}.</p>
      <div class="acts"><button id="refBack">Back</button><button class="p" id="refOut">Sign out</button></div>
    </div></div>`);
    document.getElementById("refBack").onclick=()=>history.length>1?history.back():location.href="/pos";
    document.getElementById("refOut").onclick=async()=>{
      await fetch("/v1/session/signout",{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({deviceId:DEVICE})});
      location.href="/";
    };
  }
}
applyVisibility();

/* ---------- the four cards ----------
   Each stat comes from a read the corresponding screen already has; this
   page formats and never computes. A card whose read fails (a role with
   no PIN held, a network hiccup) renders without its stat line rather than
   a broken one, per the ticket's own invariant. */
function card(title,href,stat,links){
  const li=(links||[]).map(l=>`<a href="${l.href}">${esc(l.label)}</a>`).join("");
  return `<div class="card">
    <a class="card-h" href="${href}">${esc(title)}<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M7.5 4l6 6-6 6"/></svg></a>
    <div class="card-stat${stat?"":" muted"}">${stat?esc(stat):"&nbsp;"}</div>
    ${li?`<div class="card-links">${li}</div>`:""}
  </div>`;
}

async function menuStat(){
  try{
    const d=await dget("/v1/menu/draft").then(r=>r.json());
    const live=`${d.activeCount} item${d.activeCount===1?"":"s"} live`;
    return `${live} · ${d.draft?"draft in progress":"no draft"}`;
  }catch(_){return "";}
}
async function reportsStat(){
  try{
    const d=await dget("/v1/day").then(r=>r.json());
    if(!d.summary||d.summary.checksClosed===0)return "no sales yet";
    return money(d.summary.totalMinor)+" net so far tonight";
  }catch(_){return "";}
}
async function scheduleStat(){
  // POST because a manager PIN travels in the body, never a URL (the
  // schedule's own precedent); this page holds no PIN of its own, so on a
  // fresh visit the read is refused and the card simply carries no stat,
  // which is the documented degrade rather than a workaround
  try{
    const res=await fetch("/v1/schedule/week",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({operationId:crypto.randomUUID(),deviceId:DEVICE})});
    if(!res.ok)return "";
    const d=await res.json();
    return d.totals.allPublished?"week published":`${d.totals.draft} draft${d.totals.draft===1?"":"s"}`;
  }catch(_){return "";}
}
async function teamStat(){
  try{
    const [venue,staff]=await Promise.all([
      dget("/v1/venue").then(r=>r.json()),
      dget("/v1/staff").then(r=>r.json()),
    ]);
    const headcount=(staff.staff||[]).filter(s=>s.active).length;
    return `${venue.name} · ${headcount} on the team`;
  }catch(_){return "";}
}

async function render(){
  const [menu,reports,schedule,team]=await Promise.all([menuStat(),reportsStat(),scheduleStat(),teamStat()]);
  $("#hub").innerHTML=[
    card("Menu","/menu",menu,[{href:"/menu#live",label:"86 board"},{href:"/menu#btnImport",label:"Import"}]),
    card("Reports","/reports",reports,[]),
    card("Schedule","/schedule?view=plan",schedule,[]),
    card("Venue & team","/settings",team,[{href:"/settings#team",label:"Team"},{href:"/settings#payroll",label:"Hours export"}]),
  ].join("");
}
render();

/* ---------- the venue's own name (E21-T2) ----------
   Identical on all ten pages; failure is silent, because a header is not
   worth an alarm. */
let VENUE={name:"RestaurantOS",address:"",timezone:""};
async function loadVenue(){
  try{
    const v=await dget("/v1/venue").then(r=>r.json());
    if(v&&v.name)VENUE=v;
  }catch(_){}
  document.querySelectorAll("[data-venue-name]").forEach(el=>{el.textContent=VENUE.name;});
}
loadVenue();

/* ---------- APP SHELL: rail badge counts (UI-T1) ----------
   Identical on all ten pages. Failure is silent: a badge that cannot be
   read must never be louder than the screen behind it. */
async function railBadges(){
  const [checks,kds]=await Promise.all([
    dget("/v1/checks").then(r=>r.json()),
    dget("/v1/kds").then(r=>r.json()),
  ]);
  railBadge("navTables",(checks.checks||[]).filter(c=>c.status!=="closed"&&c.status!=="voided").length);
  railBadge("navKds",(kds.tickets||[]).filter(t=>t.status==="open").length);
}
function railBadge(id,n){const el=document.getElementById(id);if(el)el.textContent=n>0?String(n):"";}
railBadges().catch(()=>{});
setInterval(()=>railBadges().catch(()=>{}),10000);

function setViewportH(){document.documentElement.style.setProperty("--vph",window.innerHeight+"px");}
addEventListener("resize",setViewportH);setViewportH();
</script>
</body>
</html>
